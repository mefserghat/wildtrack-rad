<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">WildTrack RAD - Supervisor review queue wireframe</title>
  <desc id="desc">Low-fidelity supervisor queue with pending reports, overdue indicators, and approve or reject controls requiring a reason category and comment.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #242424; }
    .muted { fill: #666; }
    .tiny { font-size: 12px; }
    .small { font-size: 14px; }
    .body { font-size: 16px; }
    .label { font-size: 13px; font-weight: 700; letter-spacing: .4px; }
    .heading { font-size: 25px; font-weight: 700; }
    .panel { fill: #fff; stroke: #bbb; stroke-width: 1.5; }
    .line { stroke: #ccc; stroke-width: 1; }
    .inv { fill: #fff; }
  </style>
  <rect width="1180" height="900" fill="#f1f1ef"/>
  <rect x="32" y="24" width="1116" height="52" rx="5" fill="#e3e3e0" stroke="#aaa"/>
  <text x="50" y="46" class="label">FRAME 02 / SUPERVISOR REVIEW QUEUE</text>
  <text x="50" y="65" class="tiny">STORIES: Supervisor approves or rejects a submitted report; Assigned reviewers receive notifications and an action queue</text>
  <text x="820" y="56" class="small" font-weight="700">FR-04, FR-17, FR-30</text>

  <rect x="32" y="92" width="1116" height="58" rx="4" fill="#333"/>
  <text class="inv" x="54" y="128" font-size="21" font-weight="700">WildTrack</text>
  <text x="188" y="127" class="inv small">Supervisor workspace</text>
  <rect x="926" y="106" width="198" height="32" rx="16" fill="#f1f1ef"/>
  <text x="950" y="127" class="small">Tom Kessler / North</text>

  <text x="42" y="193" class="heading">Reports awaiting review</text>
  <text x="44" y="216" class="small muted">Northern Region / 4 reports in your queue</text>
  <rect x="936" y="169" width="198" height="38" rx="4" fill="#fff" stroke="#999"/>
  <circle cx="955" cy="188" r="5" fill="#a77b20"/>
  <text x="970" y="193" class="small">2 new review notices</text>

  <rect x="40" y="238" width="390" height="600" rx="5" class="panel"/>
  <text x="60" y="269" class="label">PENDING QUEUE</text>
  <rect x="55" y="286" width="360" height="112" rx="4" fill="#e9e9e6" stroke="#777" stroke-width="1.5"/>
  <text x="72" y="311" class="small" font-weight="700">NR-2026-00412</text>
  <rect x="300" y="296" width="96" height="24" rx="12" fill="#f0dfbc" stroke="#b28a3c"/>
  <text x="312" y="313" class="tiny" font-weight="700">OVERDUE*</text>
  <text x="72" y="339" class="body">Poaching + injured wildlife</text>
  <text x="72" y="364" class="small muted">Submitted Nov 04 / 14:32</text>
  <text x="72" y="385" class="tiny muted">Assigned to you / selected</text>
  <line x1="60" y1="416" x2="410" y2="416" class="line"/>
  <text x="72" y="446" class="small" font-weight="700">NR-2026-00411</text>
  <text x="72" y="470" class="body">Habitat damage</text>
  <text x="72" y="493" class="small muted">Submitted Nov 05 / 08:10</text>
  <line x1="60" y1="510" x2="410" y2="510" class="line"/>
  <text x="72" y="540" class="small" font-weight="700">NR-2026-00408</text>
  <text x="72" y="564" class="body">Injured wildlife</text>
  <text x="72" y="587" class="small muted">Submitted Nov 02 / 11:05</text>
  <rect x="305" y="525" width="95" height="23" rx="11" fill="#f0dfbc" stroke="#b28a3c"/>
  <text x="316" y="541" class="tiny" font-weight="700">OVERDUE*</text>
  <line x1="60" y1="618" x2="410" y2="618" class="line"/>
  <text x="72" y="650" class="small" font-weight="700">NR-2026-00405</text>
  <text x="72" y="674" class="body">Poaching</text>
  <text x="72" y="697" class="small muted">Submitted Nov 03 / 16:22</text>
  <text x="60" y="804" class="tiny muted">*Overdue threshold is a customer decision still pending.</text>

  <rect x="452" y="238" width="688" height="600" rx="5" class="panel"/>
  <text x="478" y="270" class="label">SELECTED REPORT / NR-2026-00412</text>
  <text x="478" y="304" class="heading">Poaching + injured wildlife</text>
  <text x="478" y="332" class="small muted">Ranger: Sam Lee / Submitted Nov 04, 2026 at 14:32</text>
  <rect x="478" y="350" width="636" height="66" rx="4" fill="#f5f5f3" stroke="#ccc"/>
  <text x="498" y="377" class="small">Species: Bald eagle</text>
  <text x="750" y="377" class="small">Evidence: 1 collected item</text>
  <text x="498" y="401" class="small">Required evidence fields complete</text>
  <text x="750" y="401" class="small">Photos: 2 attached</text>
  <line x1="478" y1="438" x2="1114" y2="438" class="line"/>
  <text x="478" y="468" class="label">REVIEW DECISION</text>
  <rect x="478" y="485" width="150" height="44" rx="4" fill="#e6e6e2" stroke="#777"/>
  <text x="522" y="513" class="body" font-weight="700">Approve</text>
  <text x="650" y="513" class="small muted">Approval routes poaching reports to liaison review.</text>
  <text x="478" y="566" class="label">REJECT / RETURN TO RANGER</text>
  <text x="478" y="593" class="small">Reason category * (required)</text>
  <rect x="478" y="603" width="300" height="42" rx="3" fill="#fafafa" stroke="#999"/>
  <text x="494" y="629" class="small muted">Select reason category</text>
  <text x="478" y="676" class="small">Comment * (required)</text>
  <rect x="478" y="687" width="636" height="76" rx="3" fill="#fafafa" stroke="#999"/>
  <text x="494" y="714" class="small muted">Explain what needs correction...</text>
  <rect x="478" y="782" width="188" height="40" rx="4" fill="#d7d7d4" stroke="#aaa"/>
  <text x="499" y="807" class="small muted" font-weight="700">Reject (disabled)</text>
  <text x="685" y="807" class="tiny muted">Enter a category and comment to enable.</text>
</svg>
