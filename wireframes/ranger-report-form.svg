<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">WildTrack RAD - Ranger report form wireframe</title>
  <desc id="desc">Low-fidelity landscape iPad report form with multiple incident types, conditional poaching evidence, offline status, photos, attestation, and blocked submission.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #242424; }
    .muted { fill: #666; }
    .tiny { font-size: 12px; }
    .small { font-size: 14px; }
    .body { font-size: 16px; }
    .label { font-size: 13px; font-weight: 700; letter-spacing: .4px; }
    .heading { font-size: 25px; font-weight: 700; }
    .panel { fill: #fff; stroke: #bbb; stroke-width: 1.5; }
    .field { fill: #fafafa; stroke: #aaa; stroke-width: 1.2; }
    .line { stroke: #ccc; stroke-width: 1; }
    .tag { fill: #eee; stroke: #aaa; stroke-width: 1; }
    .inv { fill: #fff; }
  </style>
  <rect width="1180" height="900" fill="#f1f1ef"/>
  <rect x="32" y="24" width="1116" height="52" rx="5" fill="#e3e3e0" stroke="#aaa"/>
  <text x="50" y="46" class="label">FRAME 01 / RANGER REPORT FORM / LANDSCAPE IPAD</text>
  <text x="50" y="65" class="tiny">STORIES: Ranger saves a report as a draft; Ranger creates a report from a standard template; related authoring stories</text>
  <text x="750" y="56" class="small" font-weight="700">FR-01, 02, 03, 06, 07, 09, 10, 11, 12, 18</text>

  <rect x="32" y="92" width="1116" height="58" rx="4" fill="#333"/>
  <text class="inv" x="54" y="128" font-size="21" font-weight="700">WildTrack</text>
  <text x="188" y="127" class="inv small">Northern Region</text>
  <rect x="868" y="107" width="262" height="30" rx="15" fill="#f1f1ef"/>
  <circle cx="886" cy="122" r="5" fill="#a77b20"/>
  <text x="900" y="127" class="small">OFFLINE - SAVED ON DEVICE</text>

  <text x="42" y="191" class="heading">New wildlife incident report</text>
  <text x="44" y="214" class="small muted">Report number: Number pending</text>
  <rect x="944" y="169" width="190" height="42" rx="4" fill="#fff" stroke="#888"/>
  <text x="970" y="196" class="body" font-weight="700">Save Draft</text>

  <rect x="40" y="232" width="740" height="160" rx="5" class="panel"/>
  <text x="60" y="260" class="label">INCIDENT TYPE (SELECT ALL THAT APPLY)</text>
  <rect x="60" y="276" width="20" height="20" fill="#fff" stroke="#555"/>
  <path d="M64 286 l5 5 l9 -11" fill="none" stroke="#333" stroke-width="2.5"/>
  <text x="92" y="292" class="body">Injured wildlife</text>
  <rect x="300" y="276" width="20" height="20" fill="#fff" stroke="#555"/>
  <path d="M304 286 l5 5 l9 -11" fill="none" stroke="#333" stroke-width="2.5"/>
  <text x="332" y="292" class="body">Poaching</text>
  <rect x="60" y="326" width="20" height="20" fill="#fff" stroke="#555"/>
  <text x="92" y="342" class="body">Habitat damage</text>
  <rect x="300" y="326" width="20" height="20" fill="#fff" stroke="#555"/>
  <text x="332" y="342" class="body">Human–wildlife conflict</text>
  <rect x="540" y="272" width="220" height="40" rx="4" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="566" y="297" class="body" font-weight="700">Notify rehab vet now</text>
  <text x="540" y="330" class="tiny muted">Sends species, condition, and pickup</text>
  <text x="540" y="345" class="tiny muted">location only, before approval.</text>
  <text x="60" y="374" class="small muted">Multiple selections are allowed. Poaching selection displays the evidence fields below.</text>

  <rect x="40" y="406" width="740" height="120" rx="5" class="panel"/>
  <text x="60" y="433" class="label">INCIDENT DETAILS</text>
  <text x="60" y="458" class="small">Species *</text>
  <rect x="60" y="467" width="210" height="40" rx="3" class="field"/>
  <text x="72" y="492" class="body">Bald eagle</text>
  <text x="294" y="458" class="small">Date and time *</text>
  <rect x="294" y="467" width="210" height="40" rx="3" class="field"/>
  <text x="306" y="492" class="body">Nov 05, 2026 / 09:20</text>
  <text x="528" y="458" class="small">Location *</text>
  <rect x="528" y="467" width="228" height="40" rx="3" class="field"/>
  <text x="540" y="492" class="body">Ranger GPS location</text>

  <rect x="40" y="540" width="740" height="220" rx="5" class="panel"/>
  <text x="60" y="568" class="label">POACHING EVIDENCE (SHOWN WHEN POACHING IS SELECTED)</text>
  <text x="60" y="594" class="small">Item collected *</text>
  <rect x="60" y="602" width="320" height="42" rx="3" class="field"/>
  <text x="72" y="628" class="small muted">Select evidence item</text>
  <text x="404" y="594" class="small">Collected by *</text>
  <rect x="404" y="602" width="352" height="42" rx="3" class="field"/>
  <text x="416" y="628" class="small muted">Ranger name</text>
  <text x="60" y="672" class="small">Date and time collected *</text>
  <rect x="60" y="681" width="320" height="42" rx="3" class="field"/>
  <text x="72" y="707" class="small muted">Select date and time</text>
  <text x="404" y="672" class="small">Storage location *</text>
  <rect x="404" y="681" width="352" height="42" rx="3" class="field"/>
  <text x="416" y="707" class="small muted">Enter evidence storage location</text>

  <rect x="40" y="774" width="740" height="78" rx="5" class="panel"/>
  <text x="60" y="803" class="label">PHOTOS</text>
  <rect x="175" y="787" width="180" height="46" rx="4" fill="#eee" stroke="#888"/>
  <text x="195" y="816" class="small" font-weight="700">+ Attach photo</text>
  <text x="378" y="815" class="small muted">No photos attached</text>

  <rect x="800" y="232" width="340" height="282" rx="5" class="panel"/>
  <text x="822" y="262" class="label">SUBMISSION CHECK</text>
  <rect x="822" y="278" width="296" height="34" rx="3" fill="#eee"/>
  <text x="836" y="300" class="small" font-weight="700">Submit is disabled</text>
  <text x="822" y="337" class="small" font-weight="700">Complete these required fields:</text>
  <text x="830" y="368" class="body">[ ] Item collected</text>
  <text x="830" y="397" class="body">[ ] Collector</text>
  <text x="830" y="426" class="body">[ ] Evidence date and time</text>
  <text x="830" y="455" class="body">[ ] Evidence storage location</text>
  <text x="830" y="484" class="body">[ ] Ranger attestation</text>

  <rect x="800" y="530" width="340" height="122" rx="5" class="panel"/>
  <rect x="822" y="553" width="22" height="22" fill="#fff" stroke="#555"/>
  <text x="856" y="568" class="body" font-weight="700">I attest this report is accurate.</text>
  <text x="822" y="600" class="small muted">Required before submission.</text>
  <text x="822" y="627" class="tiny muted">Author: Ranger Sam Lee</text>

  <rect x="800" y="668" width="340" height="72" rx="5" fill="#d7d7d4" stroke="#aaa"/>
  <text x="916" y="712" class="body muted" font-weight="700">Submit (disabled)</text>
  <text x="800" y="776" class="tiny muted">Offline drafts save locally; submission queues for sync.</text>
</svg>
