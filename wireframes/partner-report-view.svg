<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">WildTrack RAD - Partner report view wireframe</title>
  <desc id="desc">Low-fidelity partner report view showing a generalized location, withheld witness identity, receipt acknowledgment, and PDF download actions.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #242424; }
    .muted { fill: #666; }
    .tiny { font-size: 12px; }
    .small { font-size: 14px; }
    .body { font-size: 16px; }
    .label { font-size: 13px; font-weight: 700; letter-spacing: .4px; }
    .heading { font-size: 25px; font-weight: 700; }
    .panel { fill: #fff; stroke: #bbb; stroke-width: 1.5; }
    .field { fill: #f4f4f1; stroke: #ccc; stroke-width: 1; }
    .line { stroke: #ccc; stroke-width: 1; }
    .inv { fill: #fff; }
  </style>
  <rect width="1180" height="900" fill="#f1f1ef"/>
  <rect x="32" y="24" width="1116" height="52" rx="5" fill="#e3e3e0" stroke="#aaa"/>
  <text x="50" y="46" class="label">FRAME 03 / PARTNER REPORT VIEW</text>
  <text x="50" y="65" class="tiny">STORIES: Supervisor sends each partner an authorized report version; Partner downloads a recipient-marked PDF</text>
  <text x="900" y="56" class="small" font-weight="700">FR-05, FR-22, FR-32</text>

  <rect x="32" y="92" width="1116" height="58" rx="4" fill="#333"/>
  <text class="inv" x="54" y="128" font-size="21" font-weight="700">WildTrack</text>
  <text x="188" y="127" class="inv small">Secure partner report</text>
  <text x="935" y="127" class="inv small">Help / End session</text>

  <rect x="82" y="184" width="1016" height="105" rx="5" fill="#e8e8e5" stroke="#aaa"/>
  <text x="108" y="214" class="label">AUTHORIZED RECIPIENT COPY</text>
  <text x="108" y="245" class="heading">NR-2026-00411 / Habitat damage</text>
  <text x="108" y="270" class="small muted">Recipient: North Valley Land Management / Access expires Nov 19, 2026</text>
  <rect x="842" y="205" width="230" height="38" rx="19" fill="#f7f7f5" stroke="#aaa"/>
  <text x="870" y="229" class="small" font-weight="700">LOCATION GENERALIZED</text>

  <rect x="82" y="309" width="1016" height="452" rx="5" class="panel"/>
  <text x="112" y="346" class="label">INCIDENT SUMMARY</text>
  <text x="112" y="385" class="small muted">Incident type</text>
  <text x="350" y="385" class="body">Habitat damage</text>
  <line x1="112" y1="401" x2="1066" y2="401" class="line"/>
  <text x="112" y="435" class="small muted">Species</text>
  <text x="350" y="435" class="body">Bald eagle (sensitive species, active nest nearby)</text>
  <line x1="112" y1="451" x2="1066" y2="451" class="line"/>
  <text x="112" y="485" class="small muted">Incident date</text>
  <text x="350" y="485" class="body">Nov 05, 2026</text>
  <line x1="112" y1="501" x2="1066" y2="501" class="line"/>
  <text x="112" y="535" class="small muted">Location</text>
  <rect x="338" y="512" width="590" height="42" rx="3" class="field"/>
  <text x="354" y="539" class="body">Within approximately 1 mile of the incident area</text>
  <text x="946" y="539" class="tiny muted">GENERALIZED</text>
  <line x1="112" y1="570" x2="1066" y2="570" class="line"/>
  <text x="112" y="605" class="small muted">Witness identity</text>
  <rect x="338" y="582" width="590" height="42" rx="3" class="field"/>
  <text x="354" y="609" class="body" font-weight="700">[REDACTED]</text>
  <text x="946" y="609" class="tiny muted">WITHHELD</text>
  <line x1="112" y1="640" x2="1066" y2="640" class="line"/>
  <text x="112" y="675" class="small muted">Report summary</text>
  <text x="350" y="675" class="body">Off-trail vehicle damage to about 2 acres of habitat near an active nest.</text>
  <text x="112" y="728" class="tiny muted">Fields shown here are limited to this recipient's authorized report version.</text>

  <rect x="82" y="783" width="1016" height="72" rx="5" class="panel"/>
  <rect x="108" y="799" width="190" height="42" rx="4" fill="#fff" stroke="#777"/>
  <text x="143" y="826" class="body" font-weight="700">Download PDF</text>
  <text x="322" y="815" class="small muted">PDF contains this authorized version, marked with your name and the download time.</text>
  <text x="322" y="836" class="tiny muted">Receipt acknowledgment appears only for U.S. Fish &amp; Wildlife, state police, and sheriff recipients.</text>
</svg>
